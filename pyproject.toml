[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zugbot"
version = "1.0.0"
description = "Plant und überwacht den Pendelweg Gelnhausen - TU Darmstadt"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "icalendar>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
zugbot = "zugbot.cli:main"

[tool.setuptools]
packages = ["zugbot"]

[tool.setuptools.package-data]
zugbot = ["static/*"]
