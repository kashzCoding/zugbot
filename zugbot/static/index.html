<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ecf1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zug-Bot">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Zug-Bot</title>
<link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Design "C Fokus". Kontraste geprüft (WCAG AA, Text mind. 4,5:1):
     Orange #ffb547 nur auf Blau (4,67:1) und als Fläche/Linie; auf Weiß #9a5800 (5,57:1). */
  /* Figtree (SIL Open Font License, siehe OFL-Figtree.txt), vom Pi ausgeliefert */
  @font-face { font-family: "Figtree"; src: url("figtree.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
  :root {
    --bg: #e9ecf1;
    --karte: #ffffff;
    --text: #1b1f27;
    --grau: #5b6270;
    --chip: #f1f3f6;
    --linie: #e3e6ec;
    --akzent: #3a2fd6;
    --akzent-hell: #d6d3ff;
    --akzent-flaeche: #ebe9fd;
    --orange: #ffb547;
    --orange-text: #9a5800;
    --orange-flaeche: #fff4e0;
    --gruen: #1a7f37;
    --gruen-flaeche: #e6f4ea;
    --punkt: #22c55e;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Figtree", system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .seite { max-width: 440px; margin: 0 auto; display: grid; gap: 12px; }
  .seite > * { min-width: 0; }
  .kopf { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px 2px; }
  .kopf h1 { font-size: 17px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 9px; }
  .kopf h1 img { width: 24px; height: 24px; border-radius: 6px; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--grau); font-weight: 500; }
  .live .punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--punkt); }
  .live.nah .punkt { box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: puls 2s infinite; }
  @keyframes puls { 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

  .karte { background: var(--karte); border-radius: var(--radius); padding: 16px; }
  .karte h2 { font-size: 16px; font-weight: 700; margin: 0; }
  .klein { font-size: 13px; color: var(--grau); }
  .zeile-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  /* Kopfkarte */
  .akzent { background: var(--akzent); color: #fff; border-radius: var(--radius); padding: 18px 18px 16px; }
  .akzent .oben { font-size: 14px; font-weight: 600; color: var(--akzent-hell); }
  .akzent .gross { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 8px; }
  .akzent .zeile { font-size: 15px; font-weight: 500; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .akzent .gleis-marke { background: var(--orange); color: var(--text); border-radius: 7px; padding: 1px 8px; font-weight: 700; font-size: 14px; }
  .akzent .hinweis { font-size: 13px; color: var(--akzent-hell); margin-top: 6px; }
  .balken { display: flex; gap: 4px; margin-top: 16px; height: 8px; }
  .balken span { background: rgba(255,255,255,.85); border-radius: 4px; min-width: 6px; }
  .balken span.spaet { background: var(--orange); }
  .beschriftung { display: flex; gap: 4px; margin-top: 6px; font-size: 12px; font-weight: 600; }
  .beschriftung span { min-width: 6px; overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .beschriftung span.spaet { color: var(--orange); }

  /* Reiter Heute/Morgen */
  .reiter { display: flex; background: #fff; border-radius: 999px; padding: 4px; gap: 4px; }
  .reiter button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 9px 8px; font-size: 15px; font-weight: 700; color: var(--grau); cursor: pointer; }
  .reiter button[aria-selected="true"] { background: var(--akzent); color: #fff; }
  .reiter small { display: block; font-size: 12px; font-weight: 500; opacity: .85; }
  .tage { display: grid; gap: 12px; }
  .tag { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .tag:not(.aktiv) { display: none; }
  .tag-titel { display: none; font-size: 15px; font-weight: 700; padding: 4px 2px 0; }
  @media (min-width: 880px) {
    .seite { max-width: 900px; }
    .reiter { display: none; }
    .tage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .tag:not(.aktiv) { display: grid; }
    .tag-titel { display: block; }
  }

  /* Tageskarte */
  .info { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 7px; font-size: 14px; }
  .info li { display: flex; gap: 8px; align-items: center; }
  .info li svg { flex: none; }
  .info .fett { font-weight: 600; }
  .campus-chip { background: var(--akzent-flaeche); color: var(--akzent); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .link { border: 0; background: none; padding: 0; color: var(--akzent); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  /* Zeit-Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .zchip { border: 0; background: var(--chip); border-radius: 12px; padding: 6px 11px 5px; cursor: pointer; text-align: left; min-width: 64px; position: relative; }
  .zchip b { display: block; font-size: 16px; font-weight: 800; }
  .zchip span { display: block; font-size: 11px; color: var(--grau); font-weight: 600; }
  .zchip span.warn, .zchip span.spaet { color: var(--orange-text); }
  .zchip span.ok { color: var(--gruen); }
  .zchip[aria-pressed="true"] span.warn, .zchip[aria-pressed="true"] span.spaet { color: var(--orange); }
  .zchip[aria-pressed="true"] span.ok { color: var(--akzent-hell); }
  .zu { width: 100%; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .zu .titel-zu { display: block; font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .zu .zeit-kurz { font-size: 17px; font-weight: 800; }
  .zu .mehr { color: var(--akzent); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .lage { font-size: 13px; font-weight: 600; }
  .lage.warn, .lage.spaet { color: var(--orange-text); }
  .lage.ok { color: var(--gruen); }
  .tafel { margin-top: 16px; border-top: 1px solid var(--linie); padding-top: 12px; }
  .tafel h3 { font-size: 14px; margin: 0 0 8px; }
  .tafel-zeile { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--linie); font-size: 14px; }
  .tafel-zeile:last-child { border-bottom: 0; }
  .tafel-zeile .t { font-weight: 800; }
  .tafel-zeile .t s { display: block; font-size: 11px; font-weight: 500; color: var(--grau); }
  .tafel-zeile .t.spaet { color: var(--orange-text); }
  .tafel-zeile .wohin { min-width: 0; }
  .tafel-zeile .wohin b { font-weight: 700; }
  .tafel-zeile .wohin span { display: block; font-size: 12px; color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .knopf.klein { padding: 7px 12px; font-size: 13px; }
  .zchip[aria-pressed="true"] { background: var(--akzent); color: #fff; }
  .zchip[aria-pressed="true"] span { color: var(--akzent-hell); }
  .zchip.ueberwacht::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--punkt); }

  .auswahl { margin-top: 14px; touch-action: pan-y; }
  .gross-zeit { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .gross-zeit .pfeil { color: var(--grau); font-weight: 500; font-size: 20px; }
  .marken { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { background: var(--chip); color: var(--grau); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .chip.ueberwacht { background: var(--akzent-flaeche); color: var(--akzent); }
  .chip.empfohlen { background: var(--gruen-flaeche); color: var(--gruen); }
  .chip.warn { background: var(--orange-flaeche); color: var(--orange-text); }
  .wahl { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .knopf { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .knopf.primaer { background: var(--akzent); color: #fff; }
  .knopf.zweit { background: var(--chip); color: var(--text); }
  .knopf:disabled { opacity: .6; cursor: default; }
  .wisch-hinweis { font-size: 12px; color: var(--grau); }
  @media (hover: hover) { .wisch-hinweis { display: none; } }

  /* Balken in der Karte */
  .mini-balken { display: flex; gap: 3px; height: 6px; margin-top: 12px; }
  .mini-balken span { background: var(--akzent); border-radius: 3px; min-width: 4px; }
  .mini-balken span.tram { background: var(--orange); }
  .mini-balken span.spaet { background: var(--orange-text); }

  /* Zeitstrahl */
  .strahl { display: grid; grid-template-columns: 46px 18px minmax(0, 1fr); column-gap: 10px; margin-top: 16px; }
  .strahl .zeit { text-align: right; font-weight: 700; font-size: 15px; line-height: 1.25; }
  .strahl .zeit small { display: block; font-size: 12px; font-weight: 500; color: var(--grau); }
  .strahl .zeit .spaet { color: var(--orange-text); }
  .strahl .zeit s { display: block; font-size: 11px; color: var(--grau); font-weight: 500; }
  .schiene { position: relative; }
  .schiene::before, .schiene::after { content: ""; position: absolute; left: 7px; width: 4px; }
  .schiene::before { top: 0; height: 10px; background: var(--oben, transparent); }
  .schiene::after { top: 10px; bottom: 0; background: var(--unten, transparent); }
  .schiene i { position: absolute; left: 2px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--rand, var(--akzent)); z-index: 1; }
  .schiene.ziel i { background: var(--rand, var(--akzent)); }
  .fahrt .schiene::before { height: 100%; background: var(--farbe); }
  .fahrt .schiene::after { display: none; }
  .halt-text { padding-bottom: 4px; min-width: 0; }
  .halt-text .ort { font-weight: 700; font-size: 15px; }
  .halt-text .unter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; font-size: 13px; color: var(--grau); }
  .halt-text .warn { color: var(--orange-text); font-weight: 600; }
  .fahrt-text { padding: 8px 0 14px; font-size: 13px; color: var(--grau); min-width: 0; }
  .fahrt-text b { color: var(--text); font-size: 14px; font-weight: 700; }
  .fahrt-text .ok { color: var(--gruen); font-weight: 600; }
  .fahrt-text .spaet, .fahrt-text .ausfall { color: var(--orange-text); font-weight: 600; }
  .stadt { margin-top: 8px; padding: 9px 11px; border-radius: 12px; background: var(--orange-flaeche); font-size: 13px; color: var(--grau); }
  .stadt b { color: var(--text); }
  .zeiten { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .zeiten span { background: #fff; color: var(--text); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
  .zeiten span.deine { background: var(--akzent); color: #fff; }

  /* Zeiten anpassen */
  details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--grau); border-bottom: 2px solid var(--grau); transform: rotate(45deg); margin: 0 4px 4px; }
  details[open] summary::after { transform: rotate(-135deg); margin-bottom: -4px; }
  .formular { display: grid; gap: 12px; margin-top: 14px; }
  .formular label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--grau); min-width: 0; }
  .formular input, .formular select {
    display: block; width: 100%; min-width: 0; max-width: 100%;
    font: inherit; font-size: 16px; color: var(--text); background: var(--chip);
    border: 1px solid var(--linie); border-radius: 10px; padding: 0 10px; height: 46px; margin: 0;
    -webkit-appearance: none; appearance: none;
  }
  .formular select { background-image: linear-gradient(45deg, transparent 50%, var(--grau) 50%), linear-gradient(135deg, var(--grau) 50%, transparent 50%);
    background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  /* Safari: Zeitfeld-Inhalt sonst zentriert und mit eigener Mindestbreite */
  .formular input[type="time"]::-webkit-date-and-time-value { text-align: left; }
  .formular input[type="time"]::-webkit-datetime-edit { padding: 0; }
  .zwei { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .schnell { display: flex; gap: 6px; flex-wrap: wrap; }
  .schnell button { border: 0; background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .knoepfe { display: flex; gap: 8px; flex-wrap: wrap; }
  .meldung { font-size: 13px; font-weight: 600; min-height: 1em; }
  .meldung.fehler { color: var(--orange-text); }
  .meldung.ok { color: var(--gruen); }
  .eigene-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; color: var(--grau); }

  .stoerung { background: var(--orange-flaeche); color: var(--orange-text); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .fuss { font-size: 12px; color: var(--grau); text-align: center; line-height: 1.6; }
  .fuss a { color: var(--grau); }
  @media (prefers-reduced-motion: reduce) { .live.nah .punkt { animation: none; } }
</style>
</head>
<body>
<main class="seite">
  <header class="kopf">
    <h1><img src="logo.svg" alt=""><span id="datum">Zug-Bot</span></h1>
    <div class="live" id="live"><span class="punkt" aria-hidden="true"></span><span id="modus">lädt</span></div>
  </header>
  <div class="stoerung" id="stoerung" role="status" hidden></div>
  <section class="akzent" id="akzent" aria-live="polite"></section>
  <div class="reiter" role="tablist" id="reiter"></div>
  <div class="tage" id="tage"></div>
  <section class="karte" id="anpassen">
    <details id="anpassen-auf">
      <summary><h2>Zeiten anpassen</h2></summary>
      <div class="formular">
        <label>Tag <select id="a-tag"></select></label>
        <div class="klein" id="a-standard"></div>
        <div class="zwei">
          <label>Da sein um <input type="time" id="a-an"></label>
          <label>Zurück ab <input type="time" id="a-rueck"></label>
        </div>
        <div class="schnell" id="a-schnell" aria-label="Schnellwahl für Da sein um"></div>
        <label>Campus <select id="a-campus"><option value="">wie Stundenplan</option></select></label>
        <div class="klein">„Da sein um“ zählt wie ein Vorlesungsbeginn, du bist also 5 min vorher am Halt. Leere Felder bleiben wie im Stundenplan.</div>
        <div class="knoepfe">
          <button class="knopf primaer" id="a-speichern" type="button">Speichern</button>
          <button class="knopf zweit" id="a-zurueck" type="button">Zurücksetzen</button>
        </div>
        <div class="meldung" id="a-meldung" role="status"></div>
        <ul class="eigene-liste" id="a-liste"></ul>
      </div>
    </details>
  </section>
  <footer class="fuss">
    <span id="stand"></span><br>
    Fahrplandaten: <a href="https://transitous.org/sources/">Transitous und Quellen</a>,
    © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende.
    Gleise: DB Timetables API.
  </footer>
</main>
<script>
"use strict";
const ICON = {
  glocke: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3L4 11zM6.5 14h3" fill="none" stroke="#5b6270" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  uhr: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8" fill="none" stroke="#5b6270" stroke-width="1.6"/><path d="M8 5v3.2l2 1.3" fill="none" stroke="#5b6270" stroke-width="1.6" stroke-linecap="round"/></svg>',
  ort: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 9.8 8 14 8 14z" fill="none" stroke="#5b6270" stroke-width="1.6"/><circle cx="8" cy="6.5" r="1.6" fill="#5b6270"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 14 13H2L8 2.5zM8 6.5v3M8 11.3v.2" fill="none" stroke="#9a5800" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let daten = null, tagIndex = null, schnell = 0, timer = null;
let offen = new Set();   // aufgeklappte Nebenfahrten "datum:richtung", werden mitgeladen
try { offen = new Set(JSON.parse(sessionStorage.getItem("zugbot-offen") || "[]")); } catch (e) {}
const auswahl = {};      // "datum:richtung" -> Schlüssel der angezeigten Option

function setzen(el, html) {      // nur neu zeichnen, wenn sich etwas geändert hat
  if (el.dataset.html === html) return false;
  el.dataset.html = html; el.innerHTML = html; return true;
}

/* ---------- Kopfkarte ---------- */
function akzent(d) {
  const k = d.kopf, el = document.getElementById("akzent");
  if (k.leer) {
    setzen(el, `<div class="oben">Heute</div><div class="gross">${esc(k.leer)}</div>`
      + (k.zeile ? `<div class="zeile">${esc(k.zeile)}</div>` : ""));
    return;
  }
  const balken = k.segmente.map(s => `<span class="${s.verspaetet ? "spaet" : ""}" style="flex:${s.anteil}"></span>`).join("");
  const text = k.segmente.map(s => `<span class="${s.verspaetet ? "spaet" : ""}" style="flex:${s.anteil}">${esc(s.kurz)}${s.plus ? " " + esc(s.plus) : ""}</span>`).join("");
  const gross = k.unterwegs ? k.los.charAt(0).toUpperCase() + k.los.slice(1) : (k.los === "angekommen" ? "Angekommen" : `Los ${k.los}`);
  setzen(el, `<div class="oben">${esc(k.richtung)}</div>
    <div class="gross">${esc(gross)}</div>
    <div class="zeile"><span>${esc(k.ab)} ab ${esc(k.von)}</span>${k.gleis ? `<span class="gleis-marke">${esc(k.gleis)}</span>` : ""}<span>an ${esc(k.an)}</span></div>
    ${k.hinweis ? `<div class="hinweis">${esc(k.hinweis)}</div>` : ""}
    <div class="balken" aria-hidden="true">${balken}</div>
    <div class="beschriftung" aria-hidden="true">${text}</div>`);
}

/* ---------- Zeitstrahl ---------- */
const farbe = a => a.steig ? "var(--orange)" : "var(--akzent)";

function strahl(o) {
  let html = "";
  o.halte.forEach((h, i) => {
    const vor = o.abschnitte[i - 1], nach = o.abschnitte[i];
    const stil = `--oben:${vor ? farbe(vor) : "transparent"};--unten:${nach ? farbe(nach) : "transparent"};--rand:${farbe(nach || vor)}`;
    let zeit;
    if (h.ziel) zeit = `<span class="${h.an_spaet ? "spaet" : ""}">${esc(h.an)}</span>`;
    else zeit = (h.an ? `<small class="${h.an_spaet ? "spaet" : ""}">an ${esc(h.an)}</small>` : "")
      + `<span class="${h.ab_spaet ? "spaet" : ""}">${esc(h.ab)}</span>` + (h.ab_alt ? `<s>${esc(h.ab_alt)}</s>` : "");
    const unter = [h.gleis ? `<span class="chip">${esc(h.gleis)}</span>` : "",
                   h.umstieg ? `<span class="${h.umstieg_warn ? "warn" : ""}">${esc(h.umstieg)}</span>` : ""].join("");
    const st = o.stadt && o.stadt.halt === i ? stadtBox(o.stadt) : "";
    html += `<div class="zeit">${zeit}</div><div class="schiene ${h.ziel ? "ziel" : ""}" style="${stil}"><i></i></div>
      <div class="halt-text"><div class="ort">${esc(h.ort)}</div>${unter ? `<div class="unter">${unter}</div>` : ""}${st}</div>`;
    if (nach) html += `<div></div><div class="schiene" style="--farbe:${farbe(nach)}"></div>
      <div class="fahrt-text"><b>${esc(nach.linie)}</b>${nach.richtung ? ` Richtung ${esc(nach.richtung)}` : ""}<br>
        <span class="${nach.status_art}">${esc(nach.status)}</span> · ${esc(nach.fahrzeit)}</div>`;
  });
  return `<div class="strahl">${html}</div>`;
}

function stadtBox(st) {
  return `<div class="stadt"><b>${esc(st.text)}</b>
    <div class="zeiten" aria-label="passende Abfahrten">${st.fahrten.map(f =>
      `<span class="${f.deine ? "deine" : ""}" title="${esc(f.linie)}, an ${esc(f.an)}">${esc(f.ab)} ${esc(f.linie)}</span>`).join("")}</div></div>`;
}

/* ---------- Fahrt mit Zeit-Chips ---------- */
function gezeigt(f, datum) {
  const key = `${datum}:${f.richtung}`, liste = f.optionen;
  let o = liste.find(x => x.schluessel === auswahl[key]);
  if (!o) o = liste.find(x => x.wird_gewaehlt) || liste.find(x => x.gewaehlt) || liste[0];
  return o;
}

function zugeklappt(f, datum) {
  const k = f.kurz;
  return `<section class="karte"><button type="button" class="zu" data-auf="${esc(datum)}:${esc(f.richtung)}" aria-expanded="false">
    <span><span class="titel-zu">${esc(f.titel)}</span><span class="zeit-kurz">${esc(k.ab)} → ${esc(k.an)}</span>
      ${k.lage ? ` <span class="lage ${esc(k.lage_art)}">${esc(k.lage)}</span>` : ""}</span>
    <span class="mehr">Details</span></button></section>`;
}

function tafelHtml(t, datum, richtung) {
  if (!t || !t.zuege.length) return "";
  return `<div class="tafel"><h3>Abfahrten ${esc(t.bahnhof)} <span class="klein">· Stand ${esc(t.stand)}</span></h3>
    ${t.zuege.map(z => `<div class="tafel-zeile">
      <span class="t ${z.plus > 0 || z.ausfall ? "spaet" : ""}">${esc(z.ist)}${z.plus ? `<s>${esc(z.plan)}</s>` : ""}</span>
      <span class="wohin"><b>${esc(z.linie)}</b>${z.gleis ? ` · Gl. ${esc(z.gleis)}` : ""}<span>über ${esc(z.ueber)} → ${esc(z.ziel)}</span></span>
      ${z.ausfall ? `<span class="lage warn">fällt aus</span>` : z.deiner ? `<span class="chip ueberwacht">dein Zug</span>` :
        `<button type="button" class="knopf zweit klein" data-zug="${esc(z.pt)}" data-linie="${esc(z.linie)}"
          data-datum="${esc(datum)}" data-richtung="${esc(richtung)}">Nehme ich</button>`}
    </div>`).join("")}</div>`;
}

function fahrtKarte(f, datum) {
  if (f.zu) return zugeklappt(f, datum);
  if (!f.optionen.length) return `<section class="karte"><h2>${esc(f.titel)}</h2><div class="stoerung" style="margin-top:10px">${esc(f.fehlt)}</div></section>`;
  const o = gezeigt(f, datum), key = `${datum}:${f.richtung}`;
  const chips = f.optionen.length > 1 ? `<div class="chips" role="group" aria-label="Optionen">${f.optionen.map(x =>
    `<button type="button" class="zchip ${x.gewaehlt || x.wird_gewaehlt ? "ueberwacht" : ""}" aria-pressed="${x === o}"
      data-zeigen="${esc(x.schluessel)}" data-key="${esc(key)}" aria-label="${esc(x.ab)} bis ${esc(x.an)}${x.gewaehlt ? ", überwacht" : ""}">
      <b>${esc(x.ab)}</b><span class="${esc(x.lage_art)}">${esc(x.lage && x.lage !== "pünktlich" ? x.lage : "an " + x.an)}</span></button>`).join("")}</div>` : "";
  const marken = [o.gewaehlt ? `<span class="chip ueberwacht">Wird überwacht</span>` : "",
                  o.wird_gewaehlt ? `<span class="chip ueberwacht">Wird übernommen …</span>` : "",
                  o.empfohlen ? `<span class="chip empfohlen">Empfohlen</span>` : "",
                  o.lage && o.lage_art !== "ok" ? `<span class="chip warn">${esc(o.lage)}</span>` : "",
                  o.hinweis ? `<span class="chip warn">${esc(o.hinweis)}</span>` : ""].join("");
  const mini = o.segmente.map((s, i) => `<span class="${s.verspaetet ? "spaet" : o.abschnitte[i].steig ? "tram" : ""}" style="flex:${s.anteil}"></span>`).join("");
  const wahl = o.gewaehlt || o.wird_gewaehlt || o.vorbei ? "" :
    `<div class="wahl"><button class="knopf primaer" type="button" data-waehlen="${esc(o.schluessel)}" data-datum="${esc(datum)}"
      data-richtung="${esc(f.richtung)}">Diese nehmen</button></div>`;
  const zuKnopf = f.aufklappbar ? `<button type="button" class="link" data-zu="${esc(key)}">Einklappen</button>` :
    (f.optionen.length > 1 ? `<span class="klein">${f.optionen.length} Optionen</span>` : "");
  return `<section class="karte"><div class="zeile-kopf"><h2>${esc(f.titel)}</h2>${zuKnopf}</div>
    ${chips}
    <div class="auswahl" data-key="${esc(key)}">
      <div class="gross-zeit">${esc(o.ab)}<span class="pfeil">→</span>${esc(o.an)}</div>
      <div class="klein">${esc(o.meta)}${f.optionen.length > 1 ? ` <span class="wisch-hinweis">· wischen für andere</span>` : ""}</div>
      ${marken ? `<div class="marken">${marken}</div>` : ""}
      <div class="mini-balken" aria-hidden="true">${mini}</div>
      ${strahl(o)}
      ${wahl}
    </div>${tafelHtml(f.tafel, datum, f.richtung)}</section>`;
}

function tagHtml(t, i) {
  let info;
  if (t.frei) {
    info = `<section class="karte"><div class="zeile-kopf"><h2>${esc(t.titel)}</h2></div>
      <div style="font-size:30px;font-weight:800;margin-top:8px">frei</div>${t.grund ? `<div class="klein">${esc(t.grund)}</div>` : ""}
      ${t.eigene ? `<ul class="info"><li>${ICON.uhr}<span>Eigene Zeit: ${esc(t.eigene)}</span></li></ul>` : ""}
      <div style="margin-top:10px"><button class="link" type="button" data-aendern="${esc(t.datum)}">Trotzdem hin? Zeiten anpassen</button></div></section>`;
  } else if (t.fehlt) {
    info = `<section class="karte"><h2>${esc(t.titel)}</h2><div class="klein" style="margin-top:6px">${esc(t.fehlt)}</div></section>`;
  } else {
    info = `<section class="karte"><div class="zeile-kopf"><h2>${esc(t.titel)}</h2><span class="campus-chip">${esc(t.campus)}</span></div>
      <ul class="info">
        ${t.termin ? `<li>${ICON.ort}<span class="fett">${esc(t.termin)}</span></li>` : ""}
        <li>${ICON.uhr}<span>${t.eigene ? `Eigene Zeit: ${esc(t.eigene)}` : "Zeiten nach Stundenplan"} ·
          <button class="link" type="button" data-aendern="${esc(t.datum)}">ändern</button></span></li>
        ${t.push ? `<li>${ICON.glocke}<span>${esc(t.push)}</span></li>` : ""}
        ${(t.warnungen || []).map(w => `<li>${ICON.warn}<span>${esc(w)}</span></li>`).join("")}
      </ul></section>`;
  }
  return `<div class="tag ${i === tagIndex ? "aktiv" : ""}" role="tabpanel" id="tag-${i}" aria-labelledby="reiter-${i}">
    <div class="tag-titel">${esc(t.name)}</div>${info}${t.fahrten.map(f => fahrtKarte(f, t.datum)).join("")}</div>`;
}

function tage(d) {
  if (tagIndex === null) tagIndex = d.start_tag;
  setzen(document.getElementById("reiter"), d.tage.map((t, i) =>
    `<button type="button" role="tab" id="reiter-${i}" aria-controls="tag-${i}" aria-selected="${i === tagIndex}" data-reiter="${i}">
      ${esc(t.name)}<small>${esc(t.titel.split(",")[0])}</small></button>`).join(""));
  setzen(document.getElementById("tage"), d.tage.map(tagHtml).join(""));
}
function neuZeichnen(fokus) {
  tage(daten);
  if (fokus) { const el = document.querySelector(fokus); if (el) el.focus(); }
}

/* ---------- Zeiten anpassen ---------- */
function anpassen(d) {
  const a = d.anpassen, sel = document.getElementById("a-tag"), campus = document.getElementById("a-campus");
  if (campus.options.length === 1) a.campi.forEach(c => campus.add(new Option(c.name, c.wert)));
  const alt = sel.value;
  const optionen = a.tage.map(t => `<option value="${esc(t.datum)}">${esc(t.name)}${t.eigene ? " (eigene Zeit)" : ""}</option>`).join("");
  if (sel.dataset.html !== optionen) {
    sel.dataset.html = optionen; sel.innerHTML = optionen;
    sel.value = a.tage.some(t => t.datum === alt) ? alt : (a.tage[1] || a.tage[0]).datum;  // Standard: morgen
    if (!alt) felderFuellen();
  }
  infoAnpassen();
  document.getElementById("a-liste").innerHTML = a.tage.filter(t => t.eigene).map(t =>
    `<li>${esc(t.name)}: ${esc(t.eigene_text)}${t.ausstehend ? " · wird geplant …" : ""}</li>`).join("");
}
function aktuellerTag() {
  return daten && daten.anpassen.tage.find(t => t.datum === document.getElementById("a-tag").value);
}
function plusStunden(hhmm, h) {
  const [s, m] = hhmm.split(":").map(Number), neu = Math.min(23 * 60 + 59, s * 60 + m + h * 60);
  return `${String(Math.floor(neu / 60)).padStart(2, "0")}:${String(neu % 60).padStart(2, "0")}`;
}
function infoAnpassen() {
  const t = aktuellerTag();
  document.getElementById("a-standard").textContent = t ? `Stundenplan: ${t.standard}` : "";
  const schnell = document.getElementById("a-schnell");
  const html = t && t.beginn ? [1, 2, 3].map(h =>
    `<button type="button" data-plus="${plusStunden(t.beginn, h)}">da um ${plusStunden(t.beginn, h)}</button>`).join("") : "";
  if (schnell.dataset.html !== html) { schnell.dataset.html = html; schnell.innerHTML = html; }
}
function felderFuellen() {
  const e = (aktuellerTag() || {}).eigene || {};
  document.getElementById("a-an").value = e.an || "";
  document.getElementById("a-rueck").value = e.rueck_ab || "";
  document.getElementById("a-campus").value = e.campus || "";
  infoAnpassen();
  meldung("", "");
}
function meldung(text, art) {
  const m = document.getElementById("a-meldung");
  m.textContent = text; m.className = "meldung " + art;
}

async function senden(pfad, inhalt) {
  const r = await fetch(pfad, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(inhalt)});
  const j = await r.json().catch(() => ({fehler: "Keine Antwort vom Pi."}));
  if (!r.ok) throw new Error(j.fehler || "Fehler");
  return j;
}

async function anpassenSenden(zurueck) {
  const knoepfe = [document.getElementById("a-speichern"), document.getElementById("a-zurueck")];
  knoepfe.forEach(b => b.disabled = true);
  try {
    const inhalt = {datum: document.getElementById("a-tag").value};
    if (zurueck) inhalt.zuruecksetzen = true;
    else Object.assign(inhalt, {an: document.getElementById("a-an").value, rueck_ab: document.getElementById("a-rueck").value,
                                campus: document.getElementById("a-campus").value});
    const j = await senden("api/anpassen", inhalt);
    meldung(j.text, "ok");
    if (zurueck) ["a-an", "a-rueck", "a-campus"].forEach(id => document.getElementById(id).value = "");
    beschleunigen();
  } catch (e) {
    meldung(e.message, "fehler");
  } finally {
    knoepfe.forEach(b => b.disabled = false);
  }
}

/* ---------- Bedienung ---------- */
function blaettern(key, schritt) {
  const [datum, richtung] = key.split(":");
  const t = daten.tage.find(x => x.datum === datum), f = t && t.fahrten.find(x => x.richtung === richtung);
  if (!f || !f.optionen || f.optionen.length < 2) return;
  const i = f.optionen.indexOf(gezeigt(f, datum)), j = i + schritt;
  if (j < 0 || j >= f.optionen.length) return;
  auswahl[key] = f.optionen[j].schluessel;
  neuZeichnen();
}

document.addEventListener("click", async ev => {
  const z = ev.target.closest("[data-zeigen]");
  if (z) {
    auswahl[z.dataset.key] = z.dataset.zeigen;
    neuZeichnen(`[data-zeigen="${CSS.escape(z.dataset.zeigen)}"][data-key="${CSS.escape(z.dataset.key)}"]`);
    return;
  }
  const r = ev.target.closest("[data-reiter]");
  if (r) {
    tagIndex = +r.dataset.reiter;
    try { sessionStorage.setItem("zugbot-tag", tagIndex); } catch (e) {}
    neuZeichnen(`#reiter-${tagIndex}`);
    return;
  }
  const a = ev.target.closest("[data-aendern]");
  if (a) {
    const det = document.getElementById("anpassen-auf");
    det.open = true;
    document.getElementById("a-tag").value = a.dataset.aendern;
    felderFuellen();
    document.getElementById("anpassen").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    return;
  }
  const p = ev.target.closest("[data-plus]");
  if (p) { document.getElementById("a-an").value = p.dataset.plus; return; }
  const auf = ev.target.closest("[data-auf]"), zu = ev.target.closest("[data-zu]");
  if (auf || zu) {
    if (auf) { offen.add(auf.dataset.auf); auf.querySelector(".mehr").textContent = "lädt …"; }
    else offen.delete(zu.dataset.zu);
    try { sessionStorage.setItem("zugbot-offen", JSON.stringify([...offen])); } catch (e) {}
    planen(0);
    return;
  }
  const zg = ev.target.closest("[data-zug]");
  if (zg) {
    zg.disabled = true; zg.textContent = "Plane …";
    try {
      const j = await senden("api/zug", {datum: zg.dataset.datum, richtung: zg.dataset.richtung,
                                         pt: zg.dataset.zug, linie: zg.dataset.linie});
      meldungBei(zg, j.text, "ok");
      beschleunigen();
    } catch (e) {
      zg.disabled = false; zg.textContent = "Nehme ich";
      meldungBei(zg, e.message);
    }
    return;
  }
  const w = ev.target.closest("[data-waehlen]");
  if (w) {
    w.disabled = true; w.textContent = "Wird übernommen …";
    try {
      await senden("api/waehlen", {datum: w.dataset.datum, richtung: w.dataset.richtung, schluessel: w.dataset.waehlen});
      beschleunigen();
    } catch (e) {
      w.disabled = false; w.textContent = "Diese nehmen";
      meldungBei(w, e.message);
    }
  }
});
function meldungBei(el, text, art) {
  const m = document.createElement("span");
  m.className = "klein"; m.style.color = art === "ok" ? "var(--gruen)" : "var(--orange-text)"; m.textContent = text;
  m.style.gridColumn = "1 / -1";      // in der Tafel über die ganze Zeile
  el.after(m);
}

/* Wischen über eine Verbindung: genau eine Option weiter oder zurück */
let wisch = null;
document.addEventListener("touchstart", ev => {
  const a = ev.target.closest(".auswahl");
  wisch = a && ev.touches.length === 1 ? {key: a.dataset.key, x: ev.touches[0].clientX, y: ev.touches[0].clientY} : null;
}, {passive: true});
document.addEventListener("touchend", ev => {
  if (!wisch) return;
  const dx = ev.changedTouches[0].clientX - wisch.x, dy = ev.changedTouches[0].clientY - wisch.y;
  if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) blaettern(wisch.key, dx < 0 ? 1 : -1);
  wisch = null;
}, {passive: true});
/* Tastatur: Pfeiltasten auf den Chips */
document.addEventListener("keydown", ev => {
  const z = ev.target.closest && ev.target.closest("[data-zeigen]");
  if (!z || (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft")) return;
  ev.preventDefault();
  blaettern(z.dataset.key, ev.key === "ArrowRight" ? 1 : -1);
  const f = document.querySelector(`[data-key="${CSS.escape(z.dataset.key)}"][aria-pressed="true"]`);
  if (f) f.focus();
});

document.getElementById("a-tag").addEventListener("change", felderFuellen);
document.getElementById("a-speichern").addEventListener("click", () => anpassenSenden(false));
document.getElementById("a-zurueck").addEventListener("click", () => anpassenSenden(true));
try { const t = sessionStorage.getItem("zugbot-tag"); if (t !== null) tagIndex = +t; } catch (e) {}

/* Nach einer Änderung kurz öfter nachfragen, bis der Dienst sie übernommen hat */
function beschleunigen() { schnell = 20; planen(1500); }
function planen(ms) { clearTimeout(timer); timer = setTimeout(laden, ms); }

async function laden() {
  try {
    // relativ, weil die Seite unter /<schlüssel>/ liegt
    const r = await fetch("api/status" + (offen.size ? "?offen=" + encodeURIComponent([...offen].join(",")) : ""),
                          {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    var d = await r.json();
  } catch (e) {
    // nur hier ist der Pi wirklich nicht erreichbar (Netz, Funnel, Dienst aus)
    document.getElementById("modus").textContent = "Pi nicht erreichbar";
    schnell = 0;
    planen(60000);
    return;
  }
  try {
    daten = d;
    document.getElementById("datum").textContent = d.datum;
    document.getElementById("modus").textContent = d.modus;
    document.getElementById("live").classList.toggle("nah", d.modus.startsWith("live"));
    const st = document.getElementById("stoerung");
    st.hidden = !d.stoerung;
    st.textContent = d.stoerung;
    document.getElementById("stand").textContent = d.aktualisiert ? `Zuletzt geprüft ${d.aktualisiert} Uhr` : "";
    // ausgewählte Chips nach einer Übernahme wieder der überwachten Fahrt folgen lassen
    d.tage.forEach(t => t.fahrten.forEach(f => { if ((f.optionen || []).some(o => o.wird_gewaehlt)) delete auswahl[`${t.datum}:${f.richtung}`]; }));
    akzent(d); tage(d); anpassen(d);
    const wartend = JSON.stringify(d.tage).includes('"wird_gewaehlt":true') || d.anpassen.tage.some(t => t.ausstehend);
    if (wartend && schnell > 0) { schnell--; planen(3000); return; }
  } catch (e) {
    // Daten sind da, aber die Anzeige ist gescheitert: ehrlich sagen statt "nicht erreichbar"
    console.error(e);
    document.getElementById("modus").textContent = "Anzeigefehler, bitte neu laden";
  }
  schnell = 0;
  planen(60000);
}
laden();
</script>
</body>
</html>
